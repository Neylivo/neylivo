<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ponoi call overlay</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  html, body { background:transparent; overflow:hidden; font-family:'Segoe UI', system-ui, sans-serif; }
  #panel { display:flex; flex-direction:column; gap:2px; padding:6px; }
  .row {
    display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:8px;
    background:rgba(17,18,20,.45); backdrop-filter:blur(2px);
    box-shadow:0 2px 10px rgba(0,0,0,.25); transition:box-shadow .12s ease, background .12s ease;
    animation:in .18s ease both;
  }
  .row:hover { background:rgba(17,18,20,.78); }
  @keyframes in { from { opacity:0; transform:translateX(-10px) } to { opacity:1; transform:none } }
  .row.speaking { box-shadow:0 0 0 2px #23a55a, 0 2px 10px rgba(0,0,0,.25); }
  .row.sharing { box-shadow:0 0 0 2px #ed4245, 0 2px 10px rgba(0,0,0,.25); }
  .row.speaking.sharing { box-shadow:0 0 0 2px #23a55a, 0 0 0 4px #ed4245, 0 2px 10px rgba(0,0,0,.25); }
  .av {
    width:26px; height:26px; border-radius:50%; flex:none; display:flex; align-items:center;
    justify-content:center; background:#5865f2; color:#fff; font-weight:700; font-size:12px;
    background-size:cover; background-position:center;
  }
  .nm { color:#f2f3f5; font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; max-width:130px; }
  .live { flex:none; color:#ed4245; font-weight:700; font-size:10px; letter-spacing:.5px;
    text-transform:uppercase; white-space:nowrap; }
  .mic { flex:none; width:16px; height:16px; display:flex; align-items:center; justify-content:center; }
  .mic svg { width:14px; height:14px; }
</style>
</head>
<body>
  <div id="panel"></div>
<script>
  var MIC_ON = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" fill="#b5bac1"/><path d="M6 11a1 1 0 1 0-2 0 8 8 0 0 0 7 7.94V21a1 1 0 1 0 2 0v-2.06A8 8 0 0 0 20 11a1 1 0 1 0-2 0 6 6 0 0 1-12 0Z" fill="#b5bac1"/></svg>'
  var MIC_OFF = '<svg viewBox="0 0 24 24" fill="none"><path d="M3 3l18 18" stroke="#ed4245" stroke-width="2" stroke-linecap="round"/><path d="M12 15a3 3 0 0 0 3-3V9.4M9 6.2V6a3 3 0 0 1 5.7-1.3" stroke="#ed4245" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M6 11a6 6 0 0 0 9.8 4.6M18 11a5.98 5.98 0 0 1-.5 2.4" stroke="#ed4245" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M12 18v3" stroke="#ed4245" stroke-width="2" stroke-linecap="round"/></svg>'
  function cleanAvatarUrl(raw) {
    try {
      var u = new URL(String(raw || ''), location.href)
      return /^(https?|blob):$/i.test(u.protocol) ? u.href : ''
    } catch (_) { return '' }
  }
  function render(list) {
    var panel = document.getElementById('panel')
    var frag = document.createDocumentFragment()
    ;(Array.isArray(list) ? list : []).forEach(function (p) {
      var nm = String((p && p.name) || '?')
      var row = document.createElement('div')
      row.className = 'row' + (p && p.speaking ? ' speaking' : '') + (p && p.screenSharing ? ' sharing' : '')
      var av = document.createElement('span')
      av.className = 'av'
      var avatarUrl = cleanAvatarUrl(p && p.avatarUrl)
      if (avatarUrl) av.style.backgroundImage = 'url("' + avatarUrl.replace(/["\\\r\n]/g, '') + '")'
      else av.textContent = nm.slice(0, 1).toUpperCase()
      var name = document.createElement('span')
      name.className = 'nm'
      name.textContent = nm
      row.appendChild(av)
      row.appendChild(name)
      if (p && p.screenSharing) {
        var live = document.createElement('span')
        live.className = 'live'
        live.textContent = 'Демонстрация'
        row.appendChild(live)
      }
      var mic = document.createElement('span')
      mic.className = 'mic'
      mic.innerHTML = p && p.micOn === false ? MIC_OFF : MIC_ON
      row.appendChild(mic)
      frag.appendChild(row)
    })
    panel.replaceChildren(frag)
  }
  window.ponoiCallOverlay && window.ponoiCallOverlay.onUpdate(render)
</script>
</body>
</html>
