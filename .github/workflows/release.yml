name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # полная история — нужна scripts/gen-changelog.mjs для "Что нового"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create .env from secrets
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_TENOR_KEY=${{ secrets.VITE_TENOR_KEY }}" >> .env
          echo "VITE_STEAMGRIDDB_KEY=${{ secrets.VITE_STEAMGRIDDB_KEY }}" >> .env

      - name: Build installer and publish release (tag build)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

      - name: Build installer (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run dist -- --publish never

      - name: Upload installer artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: NeyLivo-Setup
          path: release/*.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # полная история — нужна scripts/gen-changelog.mjs для "Что нового"

      # v1.209.0: реальная причина всех падений android-apk — @capacitor/cli@8.4.1
      # требует Node >=22, а тут стоял Node 20 (windows-installer/pages используют
      # 20 и им хватает — только Capacitor это требует). Локально не ловилось,
      # т.к. на машине разработчика уже стоит Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # v1.210.0: capacitor-android компилируется с sourceCompatibility/
      # targetCompatibility JavaVersion.VERSION_21 (генерируется самим Capacitor
      # CLI в capacitor.build.gradle) — JDK 17 не может собрать под release 21
      # ("invalid source release: 21"), нужен JDK 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Create .env from secrets
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_VAPID_PUBLIC_KEY=${{ secrets.VITE_VAPID_PUBLIC_KEY }}" >> .env
          echo "VITE_TENOR_KEY=${{ secrets.VITE_TENOR_KEY }}" >> .env
          echo "VITE_STEAMGRIDDB_KEY=${{ secrets.VITE_STEAMGRIDDB_KEY }}" >> .env

      # v1.207.0: раньше это был один run: со всеми командами — упало на этом шаге
      # без доступных публично логов (GitHub Actions отдаёт полные логи только по
      # авторизованному токену), поэтому не удалось понять, какая именно команда
      # виновата. Разбито на отдельные именованные шаги — если снова упадёт,
      # виновник виден по названию шага уже из бесплатного публичного API/страницы.
      - name: Build web bundle
        run: npm run build

      # v1.208.0: настоящая причина падения этого шага — gradlew был закоммичен
      # без Unix-флага исполняемости (100644 вместо 100755): собирался с Windows,
      # где такого понятия нет, а `cap sync android` под капотом дёргает
      # ./gradlew для Android-платформы. На Windows это молча работало (там
      # используется gradlew.bat), здесь падало без объяснимой публично причины
      # (полные логи GitHub отдаёт только по авторизованному токену). Флаг
      # мода в git поправлен отдельным коммитом; chmod здесь — подстраховка.
      - name: Sync web bundle into Android project
        run: |
          chmod +x android/gradlew
          npx cap sync android

      - name: Derive version name/code from package.json
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + ${PATCH:-0}))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # v1.206.0: `if: secrets.X != ''` ломает весь workflow ("Unrecognized
      # named-value: 'secrets'") — GitHub Actions не разрешает secrets прямо в
      # if:/тернарнике env:. Проверяем наличие секрета через промежуточный шаг
      # (secrets доступны в env: обычного шага) и дальше сравниваем steps.*.outputs.
      # v1.211.0: было `echo "present=$([ -n \"$KS\" ] ...)"` — те `\"` внутри
      # $(...) не экранировали ничего полезного (YAML plain scalar не трогает
      # бэкслеши), а буквально попадали в bash как ДВА символа `"` в самом
      # тесте: `[ -n '""' ]` — непустая 2-символьная строка ВСЕГДА истинна,
      # даже когда секрет реально пуст/не существует. Поэтому шаг ниже писал
      # мусорный почти-пустой keystore.file, и Gradle падал на подписи APK
      # ("Tag number over 30 is not supported" — это просто не keystore).
      # Никакого хитрого экранирования не нужно — $(...) открывает свежий
      # контекст кавычек, обычные "$KS" внутри него работают сами по себе.
      - name: Check for release keystore secret
        id: keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            # v1.457.0: раньше здесь просто ставилось present=false, и сборка
            # молча уходила подписываться ОТЛАДОЧНЫМ ключом. А он на каждом
            # запуске новый: раннер — чистая машина, debug.keystore создаётся
            # заново со случайным ключом. Значит каждая версия подписана иначе,
            # и Android отказывается ставить её поверх прошлой со словами
            # «конфликтует с другим пакетом». Владелец приносил ровно это.
            #
            # Молчать об этом нельзя: получается APK, который выглядит рабочим и
            # не устанавливается никому, кто уже пользуется приложением.
            echo "::error::Нет секрета ANDROID_KEYSTORE_BASE64 — APK было бы подписано одноразовым отладочным ключом, и обновление не встало бы поверх установленного (Android: «конфликтует с другим пакетом»). Добавь секреты ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
            exit 1
          fi

      - name: Restore release keystore (if configured)
        if: steps.keystore.outputs.present == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > android/app/release.keystore

      - name: Build APK
        working-directory: android
        env:
          NEYLIVO_VERSION_NAME: ${{ steps.ver.outputs.name }}
          NEYLIVO_VERSION_CODE: ${{ steps.ver.outputs.code }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.present == 'true' && 'release.keystore' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "NeyLivo-Setup-${{ steps.ver.outputs.name }}.apk"

      # v1.467.1: прикладываем APK сами, с ожиданием и повтором.
      #
      # Что было. Обе задачи — сборщик установщика и сборщик APK — идут
      # ПАРАЛЛЕЛЬНО, и обе создавали релиз: установщик через electron-builder,
      # APK через action-gh-release. Кто успел первым, тот его и создал. На
      # v1.467.0 они совпали, создание не удалось, и APK не приложился вовсе:
      # релиз вышел с установщиком и без Android-сборки, а обновление на
      # телефоне просто перестало предлагаться — молча, без единой ошибки.
      #
      # Теперь эта задача релиз НЕ создаёт, пока есть надежда, что его создаст
      # соседняя: ждёт появления и загружает в готовый. Создаёт сама только
      # если соседняя задача так и не справилась — иначе APK потерялся бы уже
      # по другой причине.
      - name: Attach APK to GitHub Release (tag build)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -u
          APK=$(ls NeyLivo-Setup-*.apk | head -1)
          echo "APK: $APK"
          for i in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" "$APK" --clobber; then
                echo "APK приложен с попытки $i"
                exit 0
              fi
              echo "загрузка не удалась, попытка $i"
            else
              echo "релиза ещё нет, ждём (попытка $i)"
            fi
            sleep 10
          done
          # Пять минут соседняя задача релиз так и не создала — создаём сами,
          # иначе APK не увидит никто.
          echo "создаём релиз сами"
          gh release create "$TAG" "$APK" --title "$TAG" --notes "Android" || \
            gh release upload "$TAG" "$APK" --clobber

      - name: Upload APK artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: NeyLivo-Setup-apk
          path: NeyLivo-Setup-*.apk
